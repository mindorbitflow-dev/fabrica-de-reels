# Fabrica y publica un reel en cada franja, sin intervención.
# Horas en UTC; Colombia es UTC-5. Minuto 7 para evitar la cola de GitHub en los :00 (reels) y 37 (posts).
#   07:07 misterio      IG+FB        13:07 curiosidades IG+FB+YouTube   19:07 misterio     IG+FB+YouTube
#   10:07 curiosidades  IG+FB        16:07 misterio     IG+FB           22:07 curiosidades IG+FB
# Posts de imagen (IG+FB), :37 hora Colombia: 07 08 09 11 12 13 15 16 17 19 20 21 (UTC 12-14, 16-18, 20-22, 0-2), alternando nichos.
name: Fábrica de reels

on:
  schedule:
    - cron: "7 12 * * *"
    - cron: "7 15 * * *"
    - cron: "7 18 * * *"
    - cron: "7 21 * * *"
    - cron: "7 0 * * *"
    - cron: "7 3 * * *"
    # Posts de imagen: 12 al día en horas de uso, minuto 37 (no coinciden con los reels).
    - cron: "37 0,1,2,12,13,14,16,17,18,20,21,22 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: Qué crear
        type: choice
        options: [reel, post]
        default: reel
      niche:
        description: Nicho
        type: choice
        options: [curiosidades, misterio]
        default: curiosidades
      publish_to:
        description: Redes (separadas por coma)
        type: string
        default: instagram,facebook

permissions:
  contents: write   # guardar el historial de temas para no repetirlos

concurrency:
  group: fabrica
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONIOENCODING: utf-8
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CUSTOM_LLM_BASE_URL: ${{ secrets.CUSTOM_LLM_BASE_URL }}
      CUSTOM_LLM_API_KEY: ${{ secrets.CUSTOM_LLM_API_KEY }}
      CUSTOM_LLM_MODEL: ${{ secrets.CUSTOM_LLM_MODEL }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar FFmpeg y dependencias
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          pip install -q -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base

      - name: Elegir nicho y redes de esta franja
        id: slot
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_KIND: ${{ inputs.kind }}
          INPUT_NICHE: ${{ inputs.niche }}
          INPUT_PUBLISH_TO: ${{ inputs.publish_to }}
        run: |
          kind=reel
          case "$SCHEDULE" in
            "37 0,1,2,12,13,14,16,17,18,20,21,22 * * *")
              kind=post
              # Mitad y mitad: misterio en estas horas UTC, curiosidades en las demás.
              case "$(date -u +%H)" in 12|14|17|20|22|01) niche=misterio ;; *) niche=curiosidades ;; esac ;;
            "7 12 * * *"|"7 21 * * *"|"7 0 * * *") niche=misterio ;;
            *) niche=curiosidades ;;
          esac
          case "$SCHEDULE" in
            "7 18 * * *"|"7 0 * * *") to=instagram,facebook,youtube ;;
            *) to=instagram,facebook ;;
          esac
          echo "kind=${INPUT_KIND:-$kind}" >> "$GITHUB_OUTPUT"
          echo "niche=${INPUT_NICHE:-$niche}" >> "$GITHUB_OUTPUT"
          echo "publish_to=${INPUT_PUBLISH_TO:-$to}" >> "$GITHUB_OUTPUT"

      - name: Preparar credenciales e historial
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          if [ -n "$YOUTUBE_TOKEN" ]; then printf '%s' "$YOUTUBE_TOKEN" > config/youtube_token.json; fi
          mkdir -p output
          cp state/topic_history.json output/topic_history.json 2>/dev/null || true

      - name: Fabricar y publicar
        env:
          KIND: ${{ steps.slot.outputs.kind }}
          NICHE: ${{ steps.slot.outputs.niche }}
          PUBLISH_TO: ${{ steps.slot.outputs.publish_to }}
        run: |
          if [ "$KIND" = post ]; then
            python run.py --post --topic aleatorio --niche "$NICHE" --publish-to "$PUBLISH_TO"
          else
            python run.py --cli --topic aleatorio --niche "$NICHE" --platform reels --duration 45 --publish-to "$PUBLISH_TO"
          fi

      - name: Guardar historial de temas
        if: always()
        run: |
          [ -f output/topic_history.json ] || exit 0
          cp output/topic_history.json state/topic_history.json
          git diff --quiet state/topic_history.json && exit 0
          git config user.name "fabrica-de-reels"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Historial de temas" state/topic_history.json
          git pull --rebase -q && git push -q

      - name: Guardar el video para revisarlo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_id }}
          path: |
            output/*.mp4
            output/reel_*/publicacion.json
            output/reel_*/manifest.json
            output/reel_*/script.json
            output/post_*/post.jpg
            output/post_*/publicacion.json
          retention-days: 5
          if-no-files-found: ignore
