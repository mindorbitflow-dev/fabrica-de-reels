# Fabrica y publica un reel o un post. Lo lanza cada franja el workflow "Reloj de publicación"
# (horarios en .github/reloj.py), o se ejecuta a mano con Run workflow.
name: Fábrica de reels

on:
  workflow_dispatch:
    inputs:
      kind:
        description: Qué crear
        type: choice
        options: [reel, post]
        default: reel
      niche:
        description: Nicho
        type: choice
        options: [curiosidades, misterio]
        default: curiosidades
      publish_to:
        description: Redes (separadas por coma)
        type: string
        default: instagram,facebook

permissions:
  contents: write   # guardar el historial de temas para no repetirlos

concurrency:
  group: fabrica
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONIOENCODING: utf-8
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CUSTOM_LLM_BASE_URL: ${{ secrets.CUSTOM_LLM_BASE_URL }}
      CUSTOM_LLM_API_KEY: ${{ secrets.CUSTOM_LLM_API_KEY }}
      CUSTOM_LLM_MODEL: ${{ secrets.CUSTOM_LLM_MODEL }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar FFmpeg y dependencias
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          pip install -q -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base

      - name: Preparar credenciales e historial
        env:
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
        run: |
          if [ -n "$YOUTUBE_TOKEN" ]; then printf '%s' "$YOUTUBE_TOKEN" > config/youtube_token.json; fi
          mkdir -p output
          cp state/topic_history.json output/topic_history.json 2>/dev/null || true

      - name: Fabricar y publicar
        env:
          KIND: ${{ inputs.kind }}
          NICHE: ${{ inputs.niche }}
          PUBLISH_TO: ${{ inputs.publish_to }}
        run: |
          if [ "$KIND" = post ]; then
            python run.py --post --topic aleatorio --niche "$NICHE" --publish-to "$PUBLISH_TO"
          else
            python run.py --cli --topic aleatorio --niche "$NICHE" --platform reels --duration 45 --publish-to "$PUBLISH_TO"
          fi

      - name: Guardar historial de temas
        if: always()
        run: |
          [ -f output/topic_history.json ] || exit 0
          cp output/topic_history.json state/topic_history.json
          git diff --quiet state/topic_history.json && exit 0
          git config user.name "fabrica-de-reels"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Historial de temas" state/topic_history.json
          git pull --rebase -q && git push -q

      - name: Guardar el video para revisarlo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_id }}
          path: |
            output/*.mp4
            output/reel_*/publicacion.json
            output/reel_*/manifest.json
            output/reel_*/script.json
            output/post_*/post.jpg
            output/post_*/publicacion.json
          retention-days: 5
          if-no-files-found: ignore
