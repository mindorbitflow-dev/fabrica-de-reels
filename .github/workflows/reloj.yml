# Lanza cada franja de "Fábrica de reels" a su hora (ver .github/reloj.py).
# Cada reloj deja en cola al siguiente al empezar, así que la cadena no se corta.
# Para pausar las publicaciones: desactiva este workflow (Actions → Reloj de publicación → ⋯ → Disable workflow).
name: Reloj de publicación

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"   # respaldo: reanima la cadena si se cortó (si GitHub llega a dispararlo)

permissions:
  actions: write   # lanzar fabrica.yml y el siguiente reloj

concurrency:
  group: reloj
  cancel-in-progress: false

jobs:
  reloj:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Dejar en cola el siguiente reloj
        run: gh workflow run reloj.yml

      - name: Lanzar las franjas
        run: python3 .github/reloj.py
