documental_history:
  name: 🏺 Documental History Channel (Enigmas & Archivos Prohibidos)
  description: 'Investigaciones cinematográficas estilo History Channel: misterios
    arqueológicos, tecnologías ancestrales, archivos desclasificados y conspiraciones
    históricas.'
  tone: Solemne, profundo, dramático y de máxima intriga investigativa. Usa el clásico
    cuestionamiento del narrador de cable ('¿Y si la historia oficial estuviera equivocada?
    ¿Qué evidencia se ocultó realmente?'), pausas estratégicas de suspenso y datos
    documentados.
  visual_style: cinematic History Channel documentary footage, ancient monolithic
    temples under stormy sky, golden volumetric god rays piercing dusty archaeological
    excavation, aged parchment maps with glowing coordinates, 35mm film texture, slow
    dramatic 3D drone sweep over ancient ruins, photorealistic 8k, IMAX documentary
    quality
  recommended_voice: es-ES-AlvaroNeural
  suggested_music: historical_epic
  keywords:
  - documental
  - arqueología
  - historia oculta
  - archivos desclasificados
  - civilizaciones perdidas
  - enigma
